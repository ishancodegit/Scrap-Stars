<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Scrap Stars — 3v3 Arena Brawler</title>
<meta name="description" content="Scrap Stars — a fast 3v3 top-down arena brawler in the browser. Eleven brawlers, five game modes, no downloads." />
<meta property="og:title" content="Scrap Stars — 3v3 Arena Brawler" />
<meta property="og:description" content="A browser 3v3 brawler: five modes, eleven brawlers, momentum-based movement." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#1b1210" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="game"></canvas>

<!-- Home -->
<div id="home" class="overlay">
  <div class="home">
    <h1 class="logo"><span>SCRAP</span><em>STARS</em></h1>

    <div class="home-cards">
      <button id="pick-brawler" class="bigcard">
        <span class="tagline">Brawler</span>
        <canvas id="home-portrait" class="portrait big" width="190" height="190"></canvas>
        <div id="home-brawler-name" class="bigname">Shelly</div>
        <div id="home-brawler-class" class="bigsub">Damage Dealer</div>
        <span class="change">Change ›</span>
      </button>

      <button id="pick-mode" class="bigcard">
        <span class="tagline">Mode</span>
        <canvas id="home-mode-icon" class="modeicon big" width="150" height="150"></canvas>
        <div id="home-mode-name" class="bigname">Gem Grab</div>
        <div id="home-mode-blurb" class="bigsub small"></div>
        <span class="change">Change ›</span>
      </button>
    </div>

    <button id="play" class="play">PLAY</button>

    <div class="homefoot">
      <div class="diffs">
        <button class="diff" data-diff="easy">Easy</button>
        <button class="diff active" data-diff="normal">Normal</button>
        <button class="diff" data-diff="hard">Hard</button>
      </div>
      <p class="keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move ·
        <kbd>Mouse</kbd> aim · <kbd>Click</kbd> shoot ·
        <kbd>E</kbd> quick attack · <kbd>Space</kbd> Super · <kbd>Q</kbd> Hypercharge
      </p>
      <button id="autoaim" class="toggle on">Auto-aim: <b>On</b></button>
    </div>
  </div>
</div>

<!-- Brawler picker -->
<div id="brawlers" class="overlay hidden">
  <div class="sheet">
    <div class="sheethead">
      <h2>Brawlers</h2>
      <button id="brawlers-back" class="ghost">Back</button>
    </div>
    <div id="brawler-grid" class="grid"></div>
  </div>
</div>

<!-- Mode picker -->
<div id="modes" class="overlay hidden">
  <div class="sheet">
    <div class="sheethead">
      <h2>Game modes</h2>
      <button id="modes-back" class="ghost">Back</button>
    </div>
    <div id="mode-list" class="modelist"></div>
  </div>
</div>

<!-- Result -->
<div id="result" class="overlay hidden">
  <div class="sheet narrow">
    <h2 id="result-title">Victory</h2>
    <p id="result-sub" class="sub"></p>
    <table id="scoreboard"></table>
    <div class="row buttons">
      <button id="again" class="play">PLAY AGAIN</button>
      <button id="result-home" class="ghost">HOME</button>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="paused" class="overlay hidden soft">
  <div class="sheet narrow">
    <h2>Paused</h2>
    <p class="sub">Press <kbd>P</kbd> to resume</p>
  </div>
</div>

<div id="rotate" class="rotate">
  <div class="rotate-inner">
    <div class="phone"></div>
    <p>Turn your phone sideways</p>
    <span>Scrap Stars plays in landscape</span>
  </div>
</div>

<div id="muted" class="corner-note">Sound: on (M)</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/map.js"></script>
<script src="js/roster.js"></script>
<script src="js/aim.js"></script>
<script src="js/sprites.js"></script>
<script src="js/abilities.js"></script>
<script src="js/entities.js"></script>
<script src="js/modes.js"></script>
<script src="js/ai.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
