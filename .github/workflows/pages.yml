# Publish the game to GitHub Pages.
#
# There is nothing to build — the game is plain script tags and runs straight
# from the repository root — so the whole checkout is uploaded as-is.
#
# Pages itself has to be switched on once by hand, under
# Settings → Pages → Source → GitHub Actions. A workflow cannot do it: creating
# a Pages site needs `administration: write`, which the built-in GITHUB_TOKEN
# is never granted and which the `permissions:` block below cannot request.
# Once it is on, every push deploys from here without further intervention.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
